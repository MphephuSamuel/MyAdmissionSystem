name: Build and Deploy WAR

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 25

      - name: Build WAR with Maven
        run: mvn clean package -DskipTests

      - name: Deploy WAR to GlassFish
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          # Prepare temporary SSH key
          echo "$SSH_PRIVATE_KEY" > key.pem
          chmod 600 key.pem

          # Ensure .ssh folder exists in the runner
          mkdir -p ~/.ssh

          # Add server to known_hosts (if not already trusted)
          ssh-keygen -F $SERVER_HOST || ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts

          # Copy WAR file to server
          scp -i key.pem target/*.war $SERVER_USER@$SERVER_HOST:$REMOTE_PATH

          # Undeploy old app if exists
          ssh -i key.pem $SERVER_USER@$SERVER_HOST "asadmin undeploy MyAdmissionSystem2-1.0-SNAPSHOT || true"

          # Deploy new WAR to root context
          ssh -i key.pem $SERVER_USER@$SERVER_HOST "asadmin deploy --contextroot / $REMOTE_PATH/MyAdmissionSystem2-1.0-SNAPSHOT.war"

          # Remove temporary key
          rm key.pem
