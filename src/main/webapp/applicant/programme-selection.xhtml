<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Programme Selection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" />

    <style>
        :root {
            --primary-color: #1d2042;
            --primary-light: #2a2e60;
            --secondary-color: #3f51b5;
            --accent-color: #ff5722;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --error-color: #f44336;
            --text-primary: #212121;
            --text-secondary: #757575;
            --divider-color: #eeeeee;
            --background-light: #f8f9fa;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        body {
            background-color: #f4f7fb;
            font-family: "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-primary);
        }

        .form-wrapper {
            max-width: 1100px;
            margin: 120px auto;
            background-color: #fff;
            padding: 0;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        .form-header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px 30px;
            position: relative;
        }

        .form-header h2 {
            margin: 0;
            font-weight: 500;
            font-size: 24px;
            display: flex;
            align-items: center;
        }

        .form-header h2 i {
            margin-right: 10px;
        }

        .progress-container {
            background-color: #ffffff;
            padding: 20px 30px;
            border-bottom: 1px solid var(--divider-color);
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-bottom: 30px;
            max-width: 600px;
            margin: 0 auto;
        }

        .progress-bar:before {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            height: 4px;
            width: 100%;
            background-color: #e0e0e0;
            z-index: 0;
        }

        .progress-bar:after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            height: 4px;
            width: 50%;
            background-color: var(--primary-color);
            z-index: 0;
        }

        .step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #fff;
            border: 2px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: relative;
            z-index: 1;
        }

        .step.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
        }

        .step-label {
            position: absolute;
            top: 40px;
            font-size: 12px;
            color: var(--text-secondary);
            width: 100px;
            text-align: center;
            left: 50%;
            transform: translateX(-50%);
        }

        .step.active .step-label {
            color: var(--primary-color);
            font-weight: bold;
        }

        .form-content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            border-radius: 8px;
            overflow: hidden;
        }

        .section-title {
            background-color: var(--background-light);
            padding: 12px 15px;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary-color);
            display: flex;
            align-items: center;
        }

        .section-title i {
            margin-right: 10px;
            color: var(--primary-color);
        }

        .ui-panelgrid .ui-panelgrid-cell {
            padding: 12px 8px;
        }

        .ui-panelgrid .ui-outputlabel,
        .ui-panelgrid .ui-inputfield,
        .ui-selectonemenu {
            width: 100% !important;
        }

        .ui-inputfield {
            padding: 10px !important;
            border-radius: 6px !important;
            border: 1px solid #ddd !important;
            transition: border-color 0.3s, box-shadow 0.3s !important;
        }

        .ui-inputfield:focus {
            border-color: var(--primary-color) !important;
            box-shadow: 0 0 0 2px rgba(29, 32, 66, 0.2) !important;
        }

        .ui-selectonemenu {
            border-radius: 6px !important;
        }

        .button-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding: 20px 30px;
            background-color: var(--background-light);
            border-top: 1px solid var(--divider-color);
        }

        .ui-button {
            width: 48%;
            border-radius: 30px !important;
            padding: 12px 20px !important;
            font-weight: 500 !important;
            transition: background-color 0.3s, transform 0.2s !important;
        }

        .ui-button.primary {
            background-color: var(--primary-color) !important;
            color: white !important;
            border: none !important;
        }

        .ui-button.secondary {
            background-color: #fff !important;
            color: var(--primary-color) !important;
            border: 2px solid var(--primary-color) !important;
        }

        .ui-button:hover {
            background-color: var(--primary-light) !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .ui-button.secondary:hover {
            background-color: rgba(29, 32, 66, 0.05) !important;
        }

        .validation-message {
            display: none;
        }

        .ui-message-error {
            display: block !important;
            margin-top: 5px;
            background-color: transparent !important;
            border: none !important;
            color: var(--error-color) !important;
            padding: 4px 0 !important;
            font-size: 12px !important;
        }

        .add-programme-btn {
            background-color: var(--primary-color) !important;
            color: white !important;
            border: none !important;
            border-radius: 6px !important;
            margin-left: 10px !important;
            padding: 10px 15px !important;
            transition: background-color 0.3s, transform 0.2s !important;
        }

        .add-programme-btn:hover {
            background-color: var(--primary-light) !important;
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .programme-selection-panel {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: var(--background-light);
            border: 1px solid var(--divider-color);
        }

        .programme-table {
            margin-top: 20px;
            box-shadow: var(--card-shadow);
            border-radius: 8px;
            overflow: hidden;
        }

        .programme-table .ui-datatable-header {
            background-color: var(--primary-color);
            color: white;
            font-weight: 500;
            padding: 12px 15px;
        }

        .programme-table th {
            background-color: var(--background-light) !important;
            border-color: var(--divider-color) !important;
            font-weight: 500 !important;
        }

        .programme-table tr:nth-child(even) {
            background-color: var(--background-light);
        }

        .required-field:after {
            content: "*";
            color: var(--error-color);
            margin-left: 4px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .form-wrapper {
                margin: 15px;
                margin-top: 110px;
                border-radius: 8px;
            }
            
            .form-content {
                padding: 15px;
            }
            
            .button-bar {
                padding: 15px;
                flex-direction: column;
            }
            
            .ui-button {
                width: 100%;
                margin-bottom: 10px;
            }

            .step-label {
                display: none;
            }
        }

        .ui-selectonemenu-panel .ui-selectonemenu-filter-container {
            width: 100% !important;
        }

        .ui-selectonemenu-panel .ui-selectonemenu-filter {
            width: 100% !important;
            padding: 8px 10px !important;
            box-shadow: none !important;
        }
        .top-bar {
            background-color: #1d2042;
            color: #f9c73d;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            width: 100%;
            position: absolute;
            top: 0;
        }

        .logo-placeholder {
            width: 65px;
            height: 65px;
            background-color: #ccc;
            border-radius: 6px;
            margin-right: 5px;
        }

        .bar-title {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .logo {
            width: 65px;
            height: 65px;
            margin-right: 5px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</h:head>

<h:body>
    
    <!-- Top UMP Bar -->
    <div class="top-bar">
        <h:graphicImage library="images" name="new-logo-preview.png" styleClass="logo" />

        <div class="bar-title">University of Mpumalanga</div>
    </div>
    <h:form styleClass="form-wrapper">
        <!-- Notification growl -->
        <p:growl id="growl" showDetail="true" life="5000"/>
        
        <!-- Header -->
        <div class="form-header">
            <h2><i class="fas fa-graduation-cap"></i> Programme Selection</h2>
        </div>
        
        <!-- Progress indicator -->
        <div class="progress-container">
            <div class="progress-bar">
                <div class="step active">
                    1
                    <div class="step-label">Personal Details</div>
                </div>
                <div class="step active">
                    2
                    <div class="step-label">Next of Kin</div>
                </div>
                <div class="step active">
                    3
                    <div class="step-label">Education</div>
                </div>
                <div class="step">
                    4
                    <div class="step-label">Review</div>
                </div>
            </div>
        </div>
        
        <div class="form-content">
            <!-- Programme Selection Section -->
            <div class="section">
                <div class="section-title">
                    <i class="fas fa-list-alt"></i> Select Your Programmes
                </div>
                
                <div class="programme-selection-panel">
                    <h:outputLabel for="programme" value="Programme:" styleClass="required-field"/>
                    <div style="display: flex; align-items: center;">
                        <p:selectOneMenu id="programme" style="width: 100%;" value="#{applicantProgrammesBean.programmeId}" filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="Select Programme" itemValue="" />
                            <f:selectItems value="#{applicantProgrammesBean.programmes}" var="programme" itemLabel="#{programme.name}" itemValue="#{programme.id}"/>
                        </p:selectOneMenu>
                        <p:commandButton value="Add Programme" 
                                        icon="pi pi-plus" 
                                        styleClass="add-programme-btn"
                                        action="#{applicantProgrammesBean.selectProgrammeChoice}" 
                                        update="selectedProgrammesTable growl" />
                    </div>
                    <p:message for="programme" styleClass="ui-message-error"/>
                </div>
            </div>
            
            <!-- Selected Programmes Section -->
            <div class="section">
                <div class="section-title">
                    <i class="fas fa-check-circle"></i> Your Selected Programmes
                </div>
                
                <p:dataTable id="selectedProgrammesTable" 
                            value="#{applicantProgrammesBean.applications}" 
                            var="theApplication" 
                            styleClass="programme-table"
                            emptyMessage="No programmes selected yet. Please select at least one programme."
                            paginator="true" 
                            rows="5"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords}">
                    
                    <p:column headerText="Choice Number" sortBy="#{theApplication.choiceNumber}">
                        <h:outputText value="#{theApplication.choiceNumber}" />
                    </p:column>
                    
                    <p:column headerText="Programme Name" sortBy="#{applicantProgrammesBean.getSubjectName(theApplication.subjectId)}">
                        <h:outputText value="#{applicantProgrammesBean.getSubjectName(theApplication.subjectId)}" />
                    </p:column>
                </p:dataTable>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="button-bar">
            <p:commandButton value="Back" 
                            action="marks-selection.xhtml?faces-redirect=true" 
                            styleClass="ui-button secondary"
                            icon="fas fa-arrow-left" />
            
            <p:commandButton value="Save and Continue" 
                            action="#{applicantProgrammesBean.saveApplications}" 
                            ajax="false" 
                            styleClass="ui-button primary"
                            icon="fas fa-arrow-right" />
        </div>
    </h:form>

    <!-- JavaScript for enhanced interactions -->
    <script type="text/javascript">
        $(document).ready(function() {
            // Animation for form sections on page load
            $(".section").each(function(i) {
                $(this).delay(100 * i).animate({
                    opacity: 1
                }, 500);
            });
        });
    </script>
</h:body>
</html>
