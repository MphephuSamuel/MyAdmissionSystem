<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>Admin Dashboard</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </h:head>
    <h:body>
        <f:event type="preRenderView" listener="#{userBean.redirectIfNotLoggedInAsAdmin}" />
        <div>Logged in as admin</div>

        <h:form style="margin-top: 20px;">
            <h:commandButton value="Logout" action="#{userBean.logout}" style="background-color: #dc3545; color: white; padding: 0.5rem 1rem; border-radius: 5px;" />
        </h:form>
    </h:body>
</html>
